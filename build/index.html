<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <title>Send a message</title>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="style.css" rel="stylesheet"></head>
    <body>
       
        <style>
            .form {
                width: 100%;
                display: inline-block;
                border: 1px solid rgba(25, 25, 25, 0.32);
            }

            .message {
                color: red;
                /* border: 1px solid; */
                border-radius: 4px;
                margin: 4px 0;
                padding: 4px;
            }

            input[type=submit] {
                visibility: collapse;
            }

            input {
                border: 0;
                outline: none;
                width: calc(100% - 2px);
            }
        </style>
        <form class="form" action="/">
            <div class="message"></div>
            <div class = "form-row"> 
            <input id="user" class="form-input" name="user" placeholder="Пользователь" type="text" autocomplete="off" maxlength="33">
            <input class="form-input" name="message-text" placeholder="Введите сообщение" type="text">
            <button type='submit'>
                <span class = "material-symbols-outlined">send</span>
            </button>
            </div>
        </form>
        <script>
            const STORAGE_KEY = 'simple-chat-message';
            const form = document.querySelector('form');
            const input = document.querySelectorAll('.form-input')[1];
            const messageDiv = document.querySelector('.message');
            const userInput = document.getElementById('user');

            function getMessages() {
                const stored = localStorage.getItem(STORAGE_KEY);
                return stored ? JSON.parse(stored) : [];
            }

            function saveMessages(messages) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            }

            function renderMessages(messages) {
                messageDiv.innerHTML = '';
                messages.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = 'message';
                    const timeStr = msg.timestamp ? formatTime(msg.timestamp) : '';
                    div.innerText = timeStr ? `[${timeStr}] ${msg.text}` : msg.text;
                    messageDiv.appendChild(div);
                });
            }

            function handleSubmit(event) {
                event.preventDefault();
                const text = input.value.trim();
                if (!text) return;
                
                const messages = getMessages();
                messages.push({ text, timestamp: Date.now() });
                saveMessages(messages);
                renderMessages(messages);
                input.value = '';
            }

            function formatTime(timestamp) {
                const day = new Date(timestamp);
                const hour = String(day.getHours()).padStart(2, '0');
                const minutes = String(day.getMinutes()).padStart(2, '0');
             return `${hour}:${minutes}`;
            }
            

            function handleKeyPress(event) {
                if (event.keyCode === 13 && !event.shiftKey) {
                    event.preventDefault();
                    handleSubmit(event);
                }
            }

            form.addEventListener('submit', handleSubmit);
            form.addEventListener('keypress', handleKeyPress);

            renderMessages(getMessages());
        </script>
    <script type="text/javascript" src="bundle.js"></script></body>
</html>
