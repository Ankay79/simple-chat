<!DOCTYPE html>
<html>
    <head lang="en">
        <meta charset="UTF-8">
        <title>Send a message</title>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="style.css" rel="stylesheet"></head>
    <body>
       
        <style>
            .form {
                width: 100%;
                display: inline-block;
                border: 1px solid rgba(25, 25, 25, 0.32);
            }

            .message {
                color: red;
                /* border: 1px solid; */
                border-radius: 4px;
                margin: 4px 0;
                padding: 4px;
            }

            input[type=submit] {
                visibility: collapse;
            }

            input {
                border: 0;
                outline: none;
                width: calc(100% - 2px);
            }
        </style>
        <form class="form" action="/">
            <div class="message"></div>
            <input class="user-input" name="Username" placeholder="Введите имя пользователя" type="text" maxlength="33">
            <input class="form-input" name="message-text" placeholder="Введите сообщение" type="text">
            <button type='submit'>
                <span class = "material-symbols-outlined">send</span>
            </button>
        </form>
        <script>
            const STORAGE_KEY = 'simple-chat-message';
            const form = document.querySelector('form');
            const input = document.querySelector('.form-input');
            const messageDiv = document.querySelector('.message');
            const userinput = document.querySelector('.user-input');

            function getMessages() {
                const stored = localStorage.getItem(STORAGE_KEY);
                return stored ? JSON.parse(stored) : [];
            }

            function saveMessages(messages) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            }

            function renderMessages(messages) {
                messageDiv.innerHTML = '';
                messages.forEach(msg => {
                    const message = getMessage(msg);
                    messageDiv.appendChild(message);
                });
            }

            function handleSubmit(event) {
                event.preventDefault();
                const textmassage = input.value.trim();
                if (!textmassage) return;
                const message = {
                    text: textmassage,
                    username: getuser(), 
                };

                const messages = getMessages();
                messages.push(message);
                saveMessages(messages);
                renderMessages(messages);
                input.value = '';
            }

            function handleKeyPress(event) {
                if (event.keyCode === 13 && !event.shiftKey) {
                    event.preventDefault();
                    handleSubmit(event);
                }
            }

            function getuser() {
                return userinput.value;
            } 
            
            function getMessage(item) {
                return `
                    <div class="message-item">
                        <span >${item.username}</span>
                        <span class="message">${item.text}</span>
                    </div>
                `
            }
            form.addEventListener('submit', handleSubmit);
            form.addEventListener('keypress', handleKeyPress);

            renderMessages(getMessages());
        </script>
    <script type="text/javascript" src="bundle.js"></script></body>
</html>
