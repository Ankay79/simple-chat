<!DOCTYPE html>
<html lang="en">
    <head lang="en">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">
        <title>Добро пожаловать! Начните общение.</title>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="style.css" rel="stylesheet"></head>
        </head>
        <body>
            <section id="login-screen" class="screen">
                <h1>Добро пожаловать в чат</h1>
                <p>Как вас зовут?</p>
                <input id="name-input" type="text" placeholder="Ваше имя" maxlength="33" autocomplete="off">
                <button id="login-button" type="button">Войти в чат</button>
            </section>
            <section id="chat-screen" class="screen hidden">
                <div class="message"></div>
                <form class="form" action="/">
                    <div class="form-left">
                        <input class="user-input" name="Username" placeholder="Введите имя пользователя" type="text" maxlength="33" readonly>
                        <input class="form-input" name="message-text" maxlength="1000" placeholder="Введите сообщение" type="text">
                        <span id="char-count">0 / 1000</span>
                    </div>
                    <input type="file" id="fileInput" style="display: none;">
                    <div class="form-buttons">
                        <button type='submit'>
                            <span class="material-symbols-outlined">send</span>
                        </button>
                        <button id="fileButton">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                    </div>
                </form>
            </section>
        </body>
</html>
